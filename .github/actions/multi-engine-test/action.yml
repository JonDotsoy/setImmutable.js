name: 'Multi-engine case tester'
description: >-
  Builds and packs this repo, then runs a set of code "cases" against a set
  of JS engines (several Node.js versions and/or Bun), and posts (or
  updates) one PR comment with a syntax x engine results table.
inputs:
  engines:
    description: >-
      Newline-separated list of engines to test, e.g.:
        node 6
        node 12
        node lts
        bun latest
    required: true
  cases:
    description: >-
      Code snippets to run, one per "case". Separate cases with a line
      containing only "---". Each case is executed as a standalone script
      against every engine above, with "setimmutable" installed from the
      tarball this action builds. A case can lead with any of these
      "// key: value" metadata comments, in any order -- each is stripped
      before the code runs, so a case never has to also be valid syntax:
        // title: <label>        results-table label (default: the
                                  code's own first line)
        // filename: <name>      the filename the case runs as (default:
                                  case-N.js or case-N.mjs)
        // type: module|commonjs forces .mjs/.js (default: inferred from
                                  a static/bare `import` or an `await`
                                  anywhere in the code, else CommonJS)
      e.g.:
        // title: Dynamic import
        // filename: dynamic-import.mjs
        // type: module
        const { default: set } = await import("setimmutable")
    required: true
  github-token:
    description: Token used to read/post the PR comment.
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    # The repo's "build" script (package.json) shells out to the `bun`
    # CLI to transpile src/*.ts, so it must be on PATH before "npm run
    # build" below, same as the "tc" jobs in test.yml.
    - uses: oven-sh/setup-bun@v2

    - name: Build package tarball
      shell: bash
      run: |
        npm run build
        npm pack
        mv setimmutable-*.tgz "$RUNNER_TEMP/setimmutable.tgz"

    - name: Run cases across engines
      id: run
      shell: bash
      env:
        ENGINES_INPUT: ${{ inputs.engines }}
        CASES_INPUT: ${{ inputs.cases }}
        TARBALL: ${{ runner.temp }}/setimmutable.tgz
      run: bash "${{ github.action_path }}/run-matrix.sh"

    - name: Comment on PR
      if: always() && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        RESULTS_TABLE: ${{ steps.run.outputs.table }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const marker = '<!-- multi-engine-test-report -->'
          const body = `${marker}\n${process.env.RESULTS_TABLE}\n`

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100
          })
          const existing = comments.find((comment) => comment.body?.includes(marker))

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body
            })
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            })
          }
