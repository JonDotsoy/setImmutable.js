name: Test2

# Exercises the ./.github/actions/multi-engine-test custom action: it packs
# this repo, then runs every "case" below (a code snippet importing
# "setimmutable") against every "engine" below (a Node.js version or Bun),
# and posts a syntax x engine results table as a PR comment.
on:
  pull_request:

jobs:
  multi-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/multi-engine-test
        with:
          engines: |
            node 6
            node 10
            node 12
            node lts
            node latest
            bun latest
            typescript latest
          # Most cases below are ESM, so set the fallback here instead of
          # repeating "// type: module" on each -- the one CommonJS case
          # still declares its own "// type: commonjs" to override it.
          default-type: module
          # Every generated file gets Node's built-in "assert" module and
          # expect-type's `expectTypeOf` injected automatically as
          # `assert`/`expectTypeOf` -- a case just calls them without
          # ever importing/requiring either itself. setimmutable ships
          # no .d.ts in the published package (see README's TypeScript
          # section), so `expectTypeOf(...).toBeFunction`/`.toBeObject`
          # is what stays meaningful and stable here -- a structural
          # `.toEqualTypeOf<ExactShape>()` against its untyped return
          # value was tried and dropped: it passed for a deliberately
          # wrong shape under a static import, and failed for the
          # correct shape under `require`, both against the same
          # typescript@latest (7.0.2) -- an expect-type/TS7 interaction
          # with implicit-any values, not something these cases should
          # depend on.
          cases: |
            // title: Static ESM import: import set from "setimmutable"
            import set from "setimmutable"
            expectTypeOf(set).toBeFunction
            assert.strictEqual(typeof set, "function")
            const result = set({}, "a.b.c", 1)
            expectTypeOf(result).toBeObject
            ---
            // title: CommonJS require: const set = require("setimmutable")
            // type: commonjs
            const set = require("setimmutable")
            expectTypeOf(set).toBeFunction
            assert.strictEqual(typeof set, "function")
            const result = set({}, "a.b.c", 1)
            expectTypeOf(result).toBeObject
            ---
            // title: Static ESM import with an array path
            import set from "setimmutable"
            expectTypeOf(set).toBeFunction
            assert.strictEqual(typeof set, "function")
            const result = set({}, ["a", "b", "c"], 1)
            expectTypeOf(result).toBeObject
            ---
            // title: Dynamic ESM import: const { default: set } = await import("setimmutable")
            const { default: set } = await import("setimmutable")
            expectTypeOf(set).toBeFunction
            assert.strictEqual(typeof set, "function")
            const result = set({}, "a.b.c", 1)
            expectTypeOf(result).toBeObject
            ---
            // title: Map: static ESM import + array-of-pairs mapping
            import map from "setimmutable/map"
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, [
              [["a", "b", "c"], 1],
              ["a.b.d", 2]
            ])
            expectTypeOf(result).toBeObject
            ---
            // title: Map: static ESM import + imperative callback mapping
            import map from "setimmutable/map"
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, (set) => {
              set(["a", "b", "c"], 1)
              set("a.b.d", 2)
            })
            expectTypeOf(result).toBeObject
            ---
            // title: Map: static ESM import + object-literal callback mapping
            import map from "setimmutable/map"
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, (set) => ({
              a: {
                b: { c: set(1) },
                l: { o: { t: set(2) } }
              }
            }))
            expectTypeOf(result).toBeObject
            ---
            // title: Map: CommonJS require + array-of-pairs mapping
            // type: commonjs
            const map = require("setimmutable/map")
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, [
              [["a", "b", "c"], 1],
              ["a.b.d", 2]
            ])
            expectTypeOf(result).toBeObject
            ---
            // title: Map: CommonJS require + imperative callback mapping
            // type: commonjs
            const map = require("setimmutable/map")
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, (set) => {
              set(["a", "b", "c"], 1)
              set("a.b.d", 2)
            })
            expectTypeOf(result).toBeObject
            ---
            // title: Map: CommonJS require + object-literal callback mapping
            // type: commonjs
            const map = require("setimmutable/map")
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, (set) => ({
              a: {
                b: { c: set(1) },
                l: { o: { t: set(2) } }
              }
            }))
            expectTypeOf(result).toBeObject
            ---
            // title: Map: dynamic ESM import + array-of-pairs mapping
            const { default: map } = await import("setimmutable/map")
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, [
              [["a", "b", "c"], 1],
              ["a.b.d", 2]
            ])
            expectTypeOf(result).toBeObject
            ---
            // title: Map: dynamic ESM import + imperative callback mapping
            const { default: map } = await import("setimmutable/map")
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, (set) => {
              set(["a", "b", "c"], 1)
              set("a.b.d", 2)
            })
            expectTypeOf(result).toBeObject
            ---
            // title: Map: dynamic ESM import + object-literal callback mapping
            const { default: map } = await import("setimmutable/map")
            expectTypeOf(map).toBeFunction
            assert.strictEqual(typeof map, "function")
            const result = map({}, (set) => ({
              a: {
                b: { c: set(1) },
                l: { o: { t: set(2) } }
              }
            }))
            expectTypeOf(result).toBeObject
            ---
            // title: Key-path: dot-separated string ("a.b.c")
            import set from "setimmutable"
            const result = set({}, "a.b.c", 1)
            expectTypeOf(result).toBeObject
            assert.deepStrictEqual(result, { a: { b: { c: 1 } } })
            ---
            // title: Key-path: single string key ("a")
            import set from "setimmutable"
            const result = set({}, "a", 1)
            expectTypeOf(result).toBeObject
            assert.deepStrictEqual(result, { a: 1 })
            ---
            // title: Key-path: array of string keys (["a", "b", "c"])
            import set from "setimmutable"
            const result = set({}, ["a", "b", "c"], 1)
            expectTypeOf(result).toBeObject
            assert.deepStrictEqual(result, { a: { b: { c: 1 } } })
            ---
            // title: Key-path: array with a numeric index (["people", 0, "firstName"])
            import set from "setimmutable"
            const result = set({}, ["people", 0, "firstName"], "Ana")
            expectTypeOf(result).toBeObject
            assert.deepStrictEqual(result, { people: [{ firstName: "Ana" }] })
            ---
            // title: Key-path: bracket/index string ("[0][1][2]")
            import set from "setimmutable"
            const result = set({}, "[0][1][2]", "a")
            expectTypeOf(result).toBeObject
            // lodash.setWith creates sparse arrays here (real holes, not
            // `null` elements) -- `[, x]` is a hole-preserving literal.
            assert.deepStrictEqual(result, { "0": [, [, , "a"]] })
            ---
            // title: Key-path: descending into an existing partial object ({ a: {} })
            import set from "setimmutable"
            const result = set({ a: {} }, "a.b.c", "hello")
            expectTypeOf(result).toBeObject
            assert.deepStrictEqual(result, { a: { b: { c: "hello" } } })
            ---
            // title: Path depth: 31 segments (TypeScript's type-level max, per README)
            import set from "setimmutable"
            const path31 = Array.from({ length: 31 }, (_, i) => "k" + i)
            const result = set({}, path31.join("."), "leaf")
            // Built via JSON.parse (rather than reassigning a variable
            // from "leaf" to a nested object across a loop) so the
            // expected value's type is "any" instead of narrowing to
            // "string" from its first assignment -- reassigning that to
            // an object further down would be a real type error here.
            const expectedJson31 = path31.reduceRight((acc, key) => `{"${key}":${acc}}`, JSON.stringify("leaf"))
            const expected31 = JSON.parse(expectedJson31)
            expectTypeOf(result).toBeObject
            assert.deepStrictEqual(result, expected31)
            ---
            // title: Path depth: 32 segments (past TypeScript's type-level max -- runtime has no such limit)
            import set from "setimmutable"
            const path32 = Array.from({ length: 32 }, (_, i) => "k" + i)
            const result = set({}, path32.join("."), "leaf")
            const expectedJson32 = path32.reduceRight((acc, key) => `{"${key}":${acc}}`, JSON.stringify("leaf"))
            const expected32 = JSON.parse(expectedJson32)
            expectTypeOf(result).toBeObject
            assert.deepStrictEqual(result, expected32)
