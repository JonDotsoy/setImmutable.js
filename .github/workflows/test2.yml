name: Test2

# Exercises the ./.github/actions/multi-engine-test custom action: it packs
# this repo, then runs every "case" below (a code snippet importing
# "setimmutable") against every "engine" below (a Node.js version or Bun),
# and posts a syntax x engine results table as a PR comment.
on:
  pull_request:

jobs:
  multi-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/multi-engine-test
        with:
          engines: |
            node 6
            node 10
            node 12
            node lts
            node latest
            bun latest
          # Most cases below are ESM, so set the fallback here instead of
          # repeating "// type: module" on each -- the one CommonJS case
          # still declares its own "// type: commonjs" to override it.
          default-type: module
          cases: |
            // title: Static ESM import: import set from "setimmutable"
            import set from "setimmutable"
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, "a.b.c", 1)
            ---
            // title: CommonJS require: const set = require("setimmutable")
            // type: commonjs
            const set = require("setimmutable")
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, "a.b.c", 1)
            ---
            // title: Static ESM import with an array path
            import set from "setimmutable"
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, ["a", "b", "c"], 1)
            ---
            // title: Dynamic ESM import: const { default: set } = await import("setimmutable")
            const { default: set } = await import("setimmutable")
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, "a.b.c", 1)
