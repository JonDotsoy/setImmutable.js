name: Test2

# Exercises the ./.github/actions/multi-engine-test custom action: it packs
# this repo, then runs every "case" below (a code snippet importing
# "setimmutable") against every "engine" below (a Node.js version or Bun),
# and posts a syntax x engine results table as a PR comment.
on:
  pull_request:

jobs:
  multi-engine:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/multi-engine-test
        with:
          engines: |
            node 6
            node 10
            node 12
            node lts
            node latest
            bun latest
          # Most cases below are ESM, so set the fallback here instead of
          # repeating "// type: module" on each -- the one CommonJS case
          # still declares its own "// type: commonjs" to override it.
          default-type: module
          cases: |
            // title: Static ESM import: import set from "setimmutable"
            import set from "setimmutable"
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, "a.b.c", 1)
            ---
            // title: CommonJS require: const set = require("setimmutable")
            // type: commonjs
            const set = require("setimmutable")
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, "a.b.c", 1)
            ---
            // title: Static ESM import with an array path
            import set from "setimmutable"
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, ["a", "b", "c"], 1)
            ---
            // title: Dynamic ESM import: const { default: set } = await import("setimmutable")
            const { default: set } = await import("setimmutable")
            if (typeof set !== "function") throw new Error("set is not a function")
            set({}, "a.b.c", 1)
            ---
            // title: Map: static ESM import + array-of-pairs mapping
            import map from "setimmutable/map"
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, [
              [["a", "b", "c"], 1],
              ["a.b.d", 2]
            ])
            ---
            // title: Map: static ESM import + imperative callback mapping
            import map from "setimmutable/map"
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, (set) => {
              set(["a", "b", "c"], 1)
              set("a.b.d", 2)
            })
            ---
            // title: Map: static ESM import + object-literal callback mapping
            import map from "setimmutable/map"
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, (set) => ({
              a: {
                b: { c: set(1) },
                l: { o: { t: set(2) } }
              }
            }))
            ---
            // title: Map: CommonJS require + array-of-pairs mapping
            // type: commonjs
            const map = require("setimmutable/map")
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, [
              [["a", "b", "c"], 1],
              ["a.b.d", 2]
            ])
            ---
            // title: Map: CommonJS require + imperative callback mapping
            // type: commonjs
            const map = require("setimmutable/map")
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, (set) => {
              set(["a", "b", "c"], 1)
              set("a.b.d", 2)
            })
            ---
            // title: Map: CommonJS require + object-literal callback mapping
            // type: commonjs
            const map = require("setimmutable/map")
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, (set) => ({
              a: {
                b: { c: set(1) },
                l: { o: { t: set(2) } }
              }
            }))
            ---
            // title: Map: dynamic ESM import + array-of-pairs mapping
            const { default: map } = await import("setimmutable/map")
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, [
              [["a", "b", "c"], 1],
              ["a.b.d", 2]
            ])
            ---
            // title: Map: dynamic ESM import + imperative callback mapping
            const { default: map } = await import("setimmutable/map")
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, (set) => {
              set(["a", "b", "c"], 1)
              set("a.b.d", 2)
            })
            ---
            // title: Map: dynamic ESM import + object-literal callback mapping
            const { default: map } = await import("setimmutable/map")
            if (typeof map !== "function") throw new Error("map is not a function")
            map({}, (set) => ({
              a: {
                b: { c: set(1) },
                l: { o: { t: set(2) } }
              }
            }))
            ---
            // title: Key-path: dot-separated string ("a.b.c")
            import set from "setimmutable"
            const result = set({}, "a.b.c", 1)
            const expected = { a: { b: { c: 1 } } }
            if (JSON.stringify(result) !== JSON.stringify(expected)) throw new Error("unexpected result: " + JSON.stringify(result))
            ---
            // title: Key-path: single string key ("a")
            import set from "setimmutable"
            const result = set({}, "a", 1)
            const expected = { a: 1 }
            if (JSON.stringify(result) !== JSON.stringify(expected)) throw new Error("unexpected result: " + JSON.stringify(result))
            ---
            // title: Key-path: array of string keys (["a", "b", "c"])
            import set from "setimmutable"
            const result = set({}, ["a", "b", "c"], 1)
            const expected = { a: { b: { c: 1 } } }
            if (JSON.stringify(result) !== JSON.stringify(expected)) throw new Error("unexpected result: " + JSON.stringify(result))
            ---
            // title: Key-path: array with a numeric index (["people", 0, "firstName"])
            import set from "setimmutable"
            const result = set({}, ["people", 0, "firstName"], "Ana")
            const expected = { people: [{ firstName: "Ana" }] }
            if (JSON.stringify(result) !== JSON.stringify(expected)) throw new Error("unexpected result: " + JSON.stringify(result))
            ---
            // title: Key-path: bracket/index string ("[0][1][2]")
            import set from "setimmutable"
            const result = set({}, "[0][1][2]", "a")
            const expected = { "0": [null, [null, null, "a"]] }
            if (JSON.stringify(result) !== JSON.stringify(expected)) throw new Error("unexpected result: " + JSON.stringify(result))
