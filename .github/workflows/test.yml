name: Test

on:
  push:
  pull_request:

env:
  # Controls where the TC jobs below that install "setimmutable" as an
  # external consumer would get the package from:
  #   - "npm" (default): the version currently published on the npm
  #     registry -- catches a stale/broken published tarball even when
  #     the source tests pass.
  #   - "pack": build this branch (`npm run build`) and install the
  #     resulting `npm pack` tarball instead -- tests what publishing
  #     this branch right now would actually produce.
  # Note: npm's "prepublishOnly" script only runs for `npm publish`, not
  # `npm pack`, so pack mode runs the build explicitly. That build
  # (gulp 3 + babel 6) only works on the Node versions it targets --
  # it's known to crash on modern Node (see TC04/TC05/tc01-types
  # below), so pack mode is expected to only succeed on TC01/TC02/TC03's
  # older runtimes. This is a pre-existing limitation of the repo's
  # build tooling, not of this switch.
  PACKAGE_SOURCE: npm

jobs:
  # TC01, TC02 and TC03 all run test/integration/tc-published-package.js
  # (shared script, parameterized by the TC_ID env var) against the
  # package under test, on the Node.js version each targets:
  #   - TC01: Node 6, the LTS active through 2017 and the version pinned
  #     in the project's original .travis.yml.
  #   - TC02: Node 10 ("Dubnium"), the LTS active for most of 2019 --
  #     there's no repo-history anchor for 2019 the way TC01 has, so
  #     this is representative of a typical production pin that year.
  #   - TC03: Node 12 ("Erbium"), the *other* Node LTS touching 2019 --
  #     it only became Active LTS in October 2019 (the last ~3 months
  #     of the year), so together TC02+TC03 cover "2019" end to end.
  #   - TC04: whatever Node LTS is current today.
  #   - TC05: whatever Node "Current" release is out today -- ahead of
  #     the LTS line, catching anything that only breaks on the newest
  #     Node before it ever reaches TC04.
  smoke-node-2017:
    name: "TC01: smoke / install setimmutable (node 6, 2017)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '6'
      - name: Install the package under test in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/tc01"
          cp test/integration/tc-published-package.js "$RUNNER_TEMP/tc01/"
          if [ "$PACKAGE_SOURCE" = "pack" ]; then
            npm install
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP/tc01"
            cd "$RUNNER_TEMP/tc01"
            npm install ./setimmutable-*.tgz
          else
            cd "$RUNNER_TEMP/tc01"
            npm install setimmutable
          fi
      - name: Run TC01
        run: node tc-published-package.js
        working-directory: ${{ runner.temp }}/tc01
        env:
          TC_ID: TC01

  smoke-node-2019:
    name: "TC02: smoke / install setimmutable (node 10, 2019)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '10'
      - name: Install the package under test in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/tc02"
          cp test/integration/tc-published-package.js "$RUNNER_TEMP/tc02/"
          if [ "$PACKAGE_SOURCE" = "pack" ]; then
            npm install
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP/tc02"
            cd "$RUNNER_TEMP/tc02"
            npm install ./setimmutable-*.tgz
          else
            cd "$RUNNER_TEMP/tc02"
            npm install setimmutable
          fi
      - name: Run TC02
        run: node tc-published-package.js
        working-directory: ${{ runner.temp }}/tc02
        env:
          TC_ID: TC02

  smoke-node-2019-12:
    name: "TC03: smoke / install setimmutable (node 12, 2019)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '12'
      - name: Install the package under test in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/tc03"
          cp test/integration/tc-published-package.js "$RUNNER_TEMP/tc03/"
          if [ "$PACKAGE_SOURCE" = "pack" ]; then
            npm install
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP/tc03"
            cd "$RUNNER_TEMP/tc03"
            npm install ./setimmutable-*.tgz
          else
            cd "$RUNNER_TEMP/tc03"
            npm install setimmutable
          fi
      - name: Run TC03
        run: node tc-published-package.js
        working-directory: ${{ runner.temp }}/tc03
        env:
          TC_ID: TC03

  smoke-node-current-lts:
    name: "TC04: smoke / install setimmutable (node lts/*, current)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install the package under test in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/tc04"
          cp test/integration/tc-published-package.js "$RUNNER_TEMP/tc04/"
          if [ "$PACKAGE_SOURCE" = "pack" ]; then
            npm install
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP/tc04"
            cd "$RUNNER_TEMP/tc04"
            npm install ./setimmutable-*.tgz
          else
            cd "$RUNNER_TEMP/tc04"
            npm install setimmutable
          fi
      - name: Run TC04
        run: node tc-published-package.js
        working-directory: ${{ runner.temp }}/tc04
        env:
          TC_ID: TC04

  smoke-node-current:
    name: "TC05: smoke / install setimmutable (node latest, current)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: latest
      - name: Install the package under test in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/tc05"
          cp test/integration/tc-published-package.js "$RUNNER_TEMP/tc05/"
          if [ "$PACKAGE_SOURCE" = "pack" ]; then
            npm install
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP/tc05"
            cd "$RUNNER_TEMP/tc05"
            npm install ./setimmutable-*.tgz
          else
            cd "$RUNNER_TEMP/tc05"
            npm install setimmutable
          fi
      - name: Run TC05
        run: node tc-published-package.js
        working-directory: ${{ runner.temp }}/tc05
        env:
          TC_ID: TC05

  # TC01 (types): type-level checks (tsc --noEmit + expect-type) for the
  # same package TC01 exercises at runtime above. Runs on a modern Node,
  # since tsc itself doesn't support Node 6. See
  # test/integration/tc01-types.test-d.ts.
  tc01-types:
    name: "TC01: types (tsc) / install setimmutable"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install the package under test and TypeScript in isolation
        run: |
          mkdir -p "$RUNNER_TEMP/tc01-types"
          cp test/integration/tc01-types.test-d.ts test/integration/tc01-types.tsconfig.json "$RUNNER_TEMP/tc01-types/"
          if [ "$PACKAGE_SOURCE" = "pack" ]; then
            npm install
            npm run build
            npm pack --pack-destination "$RUNNER_TEMP/tc01-types"
            cd "$RUNNER_TEMP/tc01-types"
            npm install ./setimmutable-*.tgz typescript@^5.9.0 expect-type@^1.4.0
          else
            cd "$RUNNER_TEMP/tc01-types"
            npm install setimmutable typescript@^5.9.0 expect-type@^1.4.0
          fi
      - name: Run TC01 (types)
        run: node_modules/.bin/tsc --noEmit -p tc01-types.tsconfig.json
        working-directory: ${{ runner.temp }}/tc01-types
