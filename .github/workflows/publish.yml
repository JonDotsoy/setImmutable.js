name: Publish (PR preview)

# Publishes a throwaway prerelease of `setimmutable` to npm on every push to
# an open PR, so reviewers can `npm install setimmutable@rc` and try the
# exact code in the PR. Uses npm Trusted Publishing (OIDC) -- no NPM_TOKEN
# secret involved, see https://docs.npmjs.com/trusted-publishers.
#
# package.json's committed version (e.g. "0.2.0-rc.1") is only the base:
# npm publish is a one-shot per version -- the registry rejects a second
# publish of a version that already exists (E403/E409) -- so a fixed
# version would only work for the PR's first push. Instead this appends the
# run number (monotonically increasing, unique per workflow run) as the
# real prerelease number, so every push gets a fresh, publishable version.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Forked PRs don't get an OIDC token for this repo's trusted publisher
    # (and shouldn't -- anyone could open one otherwise), so skip them
    # instead of failing loudly.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: https://registry.npmjs.org

      - uses: oven-sh/setup-bun@v2

      # Trusted Publishing (OIDC) needs npm 11.5.1+; the Node LTS-bundled
      # npm may be older.
      - name: Ensure npm supports Trusted Publishing
        run: npm install -g npm@latest

      - name: Set unique PR-preview version
        run: |
          BASE_VERSION=$(node -e "console.log(require('./package.json').version.replace(/-rc\.\d+$/, ''))")
          VERSION="${BASE_VERSION}-rc.${{ github.run_number }}"
          npm pkg set version="$VERSION"
          echo "Publishing $VERSION"

      - name: Publish
        run: npm publish --tag rc
